
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JARVIS ULTRON</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#dffff5;
    font-family:Arial,sans-serif;
}

#scene{
    position:fixed;
    inset:0;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.top{
    position:absolute;
    top:6vh;
    left:0;
    right:0;
    text-align:center;
}

.title{
    font-size:clamp(28px,9vw,58px);
    font-weight:800;
    letter-spacing:7px;
    text-shadow:
        0 0 8px #00ff99,
        0 0 25px #00ff99;
}

.subtitle{
    margin-top:8px;
    font-size:10px;
    letter-spacing:5px;
    opacity:.65;
}

#state{
    position:absolute;
    bottom:17vh;
    left:0;
    right:0;
    text-align:center;
    font-size:13px;
    letter-spacing:5px;
    text-shadow:0 0 12px #00ff99;
}

#transcript{
    position:absolute;
    bottom:11vh;
    left:8%;
    right:8%;
    text-align:center;
    font-size:12px;
    line-height:1.5;
    opacity:.8;
}

.controls{
    position:absolute;
    bottom:3vh;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:8px;
    pointer-events:auto;
}

button{
    border:1px solid rgba(0,255,153,.65);
    background:rgba(0,255,153,.07);
    color:#cffff0;
    padding:9px 14px;
    border-radius:22px;
    font-size:11px;
    letter-spacing:1px;
    backdrop-filter:blur(8px);
}

button:active{
    background:rgba(0,255,153,.22);
}

#settingsButton{
    position:absolute;
    top:15px;
    right:15px;
    pointer-events:auto;
    width:42px;
    height:42px;
    padding:0;
    font-size:18px;
}

#panel{
    display:none;
    position:absolute;
    top:65px;
    right:15px;
    width:280px;
    padding:18px;
    border:1px solid rgba(0,255,153,.6);
    border-radius:15px;
    background:rgba(0,8,6,.94);
    box-shadow:0 0 30px rgba(0,255,153,.12);
    pointer-events:auto;
}

.panelTitle{
    font-size:12px;
    letter-spacing:3px;
    margin-bottom:12px;
}

input{
    width:100%;
    padding:11px;
    border-radius:8px;
    border:1px solid rgba(0,255,153,.35);
    outline:none;
    background:#00100c;
    color:#fff;
}

.panel button{
    margin-top:10px;
    width:100%;
}

.ring{
    position:absolute;
    left:50%;
    top:50%;
    width:230px;
    height:230px;
    transform:translate(-50%,-50%);
    border:1px solid rgba(0,255,153,.12);
    border-radius:50%;
    pointer-events:none;
    box-shadow:
        0 0 35px rgba(0,255,153,.05),
        inset 0 0 35px rgba(0,255,153,.04);
}

.ring::before,
.ring::after{
    content:"";
    position:absolute;
    inset:18px;
    border:1px solid rgba(0,255,153,.08);
    border-radius:50%;
}

.ring::after{
    inset:45px;
}

.scan{
    position:absolute;
    left:50%;
    top:50%;
    width:300px;
    height:1px;
    transform:translate(-50%,-50%);
    background:linear-gradient(
        90deg,
        transparent,
        rgba(0,255,153,.5),
        transparent
    );
    animation:scan 3s linear infinite;
    opacity:.35;
}

@keyframes scan{
    0%{
        transform:translate(-50%,-120px);
    }
    50%{
        transform:translate(-50%,120px);
    }
    100%{
        transform:translate(-50%,-120px);
    }
}
</style>
</head>

<body>

<div id="scene"></div>

<div class="ring"></div>
<div class="scan"></div>

<div id="ui">

    <div class="top">
        <div class="title">ULTRON</div>
        <div class="subtitle">PERSONAL AI CORE</div>
    </div>

    <div id="state">IDLE</div>

    <div id="transcript">
        SYSTEM READY
    </div>

    <button id="settingsButton"
            onclick="toggleSettings()">⚙</button>

    <div id="panel">

        <div class="panelTitle">
            JARVIS CONFIGURATION
        </div>

        <input
            id="key"
            type="password"
            placeholder="Groq API key">

        <button onclick="saveKey()">
            SAVE AI KEY
        </button>

        <button onclick="enableAccessibility()">
            ENABLE PHONE CONTROL
        </button>

        <button onclick="testHome()">
            TEST HOME
        </button>

    </div>

    <div class="controls">

        <button onclick="listen()">
            LISTEN
        </button>

        <button onclick="askAI()">
            ASK
        </button>

        <button onclick="goHome()">
            HOME
        </button>

    </div>

</div>

<script type="importmap">
{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth / innerHeight,
        0.1,
        1000
    );

camera.position.z = 18;

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        alpha:true
    });

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

document
    .getElementById("scene")
    .appendChild(renderer.domElement);


/* PARTICLE SWARM */

const group =
    new THREE.Group();

scene.add(group);

const geometry =
    new THREE.TetrahedronGeometry(
        0.045,
        0
    );

const material =
    new THREE.MeshBasicMaterial({
        color:0x00ff99
    });

const particleCount = 4200;

const particles =
    new THREE.InstancedMesh(
        geometry,
        material,
        particleCount
    );

const dummy =
    new THREE.Object3D();

for(
    let i = 0;
    i < particleCount;
    i++
){

    const radius =
        2.5 +
        Math.pow(Math.random(),0.65) *
        11;

    const angle =
        Math.random() *
        Math.PI *
        2;

    const beta =
        Math.acos(
            2 * Math.random() - 1
        );

    dummy.position.set(

        radius *
        Math.sin(beta) *
        Math.cos(angle),

        radius *
        Math.sin(beta) *
        Math.sin(angle),

        radius *
        Math.cos(beta)
    );

    const scale =
        0.35 +
        Math.random() *
        1.4;

    dummy.scale.setScalar(scale);

    dummy.rotation.set(
        Math.random()*6,
        Math.random()*6,
        Math.random()*6
    );

    dummy.updateMatrix();

    particles.setMatrixAt(
        i,
        dummy.matrix
    );
}

group.add(particles);


/* JARVIS STATES */

const states = {

    idle:0x00ff99,
    listening:0x00ffff,
    thinking:0xa855f7,
    speaking:0xffa500,
    error:0xff3333
};

window.jarvisState =
function(state){

    const normalized =
        state.toLowerCase();

    document
        .getElementById("state")
        .textContent =
        normalized.toUpperCase();

    material.color.setHex(
        states[normalized] ||
        states.idle
    );
};


/* TRANSCRIPT */

window.jarvisTranscript =
function(text){

    document
        .getElementById("transcript")
        .textContent =
        text;
};


/* AI RESPONSE */

window.jarvisAnswer =
function(text){

    document
        .getElementById("transcript")
        .textContent =
        text;

    window.jarvisState(
        "speaking"
    );

    setTimeout(
        () => window.jarvisState("idle"),
        7000
    );
};


/* ERROR */

window.jarvisError =
function(text){

    document
        .getElementById("transcript")
        .textContent =
        text;

    window.jarvisState(
        "error"
    );

    setTimeout(
        () => window.jarvisState("idle"),
        3000
    );
};


/* ANIMATION */

function animate(){

    requestAnimationFrame(
        animate
    );

    group.rotation.y +=
        0.0015;

    group.rotation.x =
        Math.sin(
            Date.now()*0.00025
        ) * 0.12;

    particles.rotation.z +=
        0.0005;

    renderer.render(
        scene,
        camera
    );
}

animate();


/* RESIZE */

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* VOICE */

window.listen =
function(){

    window.jarvisState(
        "listening"
    );

    if(window.Android){

        Android.startListening();

    }else{

        window.jarvisError(
            "Android bridge unavailable"
        );
    }
};


/* HOME */

window.goHome =
function(){

    if(window.Android){

        Android.execute(
            "home"
        );
    }
};


/* ASK AI */

window.askAI =
function(){

    const question =
        prompt(
            "Ask JARVIS"
        );

    if(
        question &&
        window.Android
    ){

        window.jarvisState(
            "thinking"
        );

        Android.askAI(
            question
        );

    }else if(!window.Android){

        window.jarvisError(
            "Android bridge unavailable"
        );
    }
};


/* ACCESSIBILITY */

window.enableAccessibility =
function(){

    if(window.Android){

        Android.openAccessibility();

    }else{

        window.jarvisError(
            "Android bridge unavailable"
        );
    }
};


/* TEST HOME */

window.testHome =
function(){

    if(window.Android){

        Android.execute(
            "home"
        );
    }
};


/* SETTINGS */

window.toggleSettings =
function(){

    const panel =
        document.getElementById(
            "panel"
        );

    if(
        panel.style.display ===
        "block"
    ){

        panel.style.display =
            "none";

    }else{

        panel.style.display =
            "block";
    }
};


/* SAVE GROQ KEY */

window.saveKey =
function(){

    const key =
        document
        .getElementById("key")
        .value
        .trim();

    if(!key){

        alert(
            "Enter your Groq API key"
        );

        return;
    }

    if(window.Android){

        Android.saveKey(key);

        document
            .getElementById("transcript")
            .textContent =
            "AI KEY SAVED";

        window.jarvisState(
            "idle"
        );

    }else{

        window.jarvisError(
            "Android bridge unavailable"
        );
    }
};


/* LOAD SAVED KEY INDICATOR */

window.addEventListener(
    "load",
    function(){

        document
            .getElementById("transcript")
            .textContent =
            "SYSTEM READY";
    }
);


/* INITIAL STATE */

window.jarvisState(
    "idle"
);

</script>

</body>
              </html>
