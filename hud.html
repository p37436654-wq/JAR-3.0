<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ULTRON HUD</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#dff;font-family:Arial,sans-serif}
#scene{position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.top{position:absolute;top:5vh;text-align:center;letter-spacing:5px}
.title{font-size:clamp(22px,7vw,48px);font-weight:700;text-shadow:0 0 18px #00ff99}
.sub{font-size:11px;letter-spacing:4px;margin-top:7px;opacity:.75}
.state{position:absolute;bottom:13vh;font-size:13px;letter-spacing:4px;text-transform:uppercase}
.transcript{position:absolute;bottom:8vh;max-width:86%;text-align:center;font-size:12px;opacity:.8}
.controls{position:absolute;bottom:2vh;display:flex;gap:10px;pointer-events:auto}
button{background:rgba(0,255,153,.08);border:1px solid rgba(0,255,153,.6);color:#bfffcf;padding:8px 13px;border-radius:20px}
#settings{position:absolute;top:10px;right:10px;pointer-events:auto}
.panel{display:none;position:absolute;top:55px;right:10px;width:270px;padding:15px;background:rgba(0,10,8,.94);border:1px solid #00ff99;border-radius:12px;pointer-events:auto}
input{width:100%;box-sizing:border-box;background:#00110d;color:white;border:1px solid #155;padding:10px;border-radius:7px}
</style>
</head>
<body>
<div id="scene"></div>
<div id="ui">
  <div class="top">
    <div class="title">ULTRON</div>
    <div class="sub">PERSONAL AI CORE</div>
  </div>
  <div id="state" class="state">IDLE</div>
  <div id="transcript" class="transcript"></div>
  <button id="settings" onclick="toggleSettings()">⚙</button>
  <div id="panel" class="panel">
    <div style="margin-bottom:8px">GROQ API KEY</div>
    <input id="key" type="password" placeholder="gsk_...">
    <button onclick="saveKey()" style="margin-top:10px">SAVE</button>
    <button onclick="enableAccess()" style="margin-top:10px">ENABLE PHONE CONTROL</button>
  </div>
  <div class="controls">
    <button onclick="listen()">LISTEN</button>
    <button onclick="ask()">ASK</button>
    <button onclick="home()">HOME</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, .1, 1000);
camera.position.z = 18;

const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.getElementById('scene').appendChild(renderer.domElement);

const group = new THREE.Group();
scene.add(group);

const geo = new THREE.TetrahedronGeometry(.045,.0);
const mat = new THREE.MeshBasicMaterial({color:0x00ff99});
const count = 4200;
const mesh = new THREE.InstancedMesh(geo,mat,count);
const dummy = new THREE.Object3D();

for(let i=0;i<count;i++){
  const r=2.5+Math.pow(Math.random(),.65)*11;
  const a=Math.random()*Math.PI*2;
  const b=Math.acos(2*Math.random()-1);
  dummy.position.set(
    r*Math.sin(b)*Math.cos(a),
    r*Math.sin(b)*Math.sin(a),
    r*Math.cos(b)
  );
  dummy.scale.setScalar(.35+Math.random()*1.4);
  dummy.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);
  dummy.updateMatrix();
  mesh.setMatrixAt(i,dummy.matrix);
}
group.add(mesh);

let currentState='idle';

window.jarvisState = state => {
  currentState=state;
  document.getElementById('state').textContent=state.toUpperCase();
  const colors={
    idle:0x00ff99,listening:0x00ffff,thinking:0xa855f7,
    speaking:0xffa500,error:0xff3333
  };
  mat.color.setHex(colors[state] || colors.idle);
};

window.jarvisTranscript = text => {
  document.getElementById('transcript').textContent=text;
};

window.jarvisAnswer = text => {
  window.jarvisState('speaking');
  document.getElementById('transcript').textContent=text;
  setTimeout(()=>window.jarvisState('idle'),7000);
};

window.jarvisError = text => {
  window.jarvisState('error');
  document.getElementById('transcript').textContent=text;
  setTimeout(()=>window.jarvisState('idle'),3000);
};

function animate(){
  requestAnimationFrame(animate);
  group.rotation.y += .0015;
  group.rotation.x = Math.sin(Date.now()*.00025)*.12;
  mesh.rotation.z += .0005;
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

window.listen=()=>{
  window.jarvisState('listening');
  if(window.Android) Android.startListening();
};

window.home=()=>{
  if(window.Android) Android.execute('home');
};

window.ask=()=>{
  const q=prompt('Ask JARVIS');
  if(q && window.Android){
    window.jarvisState('thinking');
    Android.askAI(q);
  }
};

window.enableAccess=()=>{
  if(window.Android) Android.openAccessibility();
};

window.toggleSettings=()=>{
  const p=document.getElementById('panel');
  p.style.display=p.style.display==='block'?'none':'block';
};

window.saveKey=()=>{
  const key=document.getElementById('key').value.trim();
  if(!key){alert('Enter a Groq API key');return;}
  localStorage.setItem('groq_key',key);
  document.getElementById('transcript').textContent='Key saved locally for this app.';
  // The Android bridge can be extended to persist this value.
};

window.jarvisState('idle');
</script>
</body>
</html>
